<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mull</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mull</h1>
    <div id="health" class="health" aria-live="polite">connecting…</div>
  </header>

  <main>
    <section class="panel" aria-labelledby="new-job">
      <h2 id="new-job">New job</h2>
      <form id="submit">
        <label>Prompt
          <textarea name="prompt" rows="6" required placeholder="What should Mull work on?"></textarea>
        </label>
        <details>
          <summary>Options</summary>
          <label>System prompt
            <textarea name="system" rows="2" placeholder="Optional"></textarea>
          </label>
          <div class="row">
            <label>Max new tokens <input name="max_new_tokens" type="number" min="1" value="256"></label>
            <label>Temperature <input name="temperature" type="number" min="0" max="2" step="0.1" value="0"></label>
          </div>
          <label>Stop sequences <input name="stop" placeholder="Comma separated, up to 4"></label>
          <label class="check"><input name="thinking" type="checkbox"> Let the model think first (slower, sometimes better)</label>
        </details>
        <div class="actions">
          <button type="submit">Queue job</button>
          <span id="submit-error" class="error" role="alert"></span>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="jobs-title">
      <div class="panel-head">
        <h2 id="jobs-title">Jobs</h2>
        <select id="filter" aria-label="Filter by state">
          <option value="">All</option>
          <option>queued</option><option>running</option><option>done</option>
          <option>failed</option><option>cancelled</option>
        </select>
      </div>
      <ul id="jobs" class="jobs"></ul>
    </section>

    <section id="detail" class="panel detail" hidden aria-live="polite">
      <div class="panel-head">
        <h2 id="detail-title"></h2>
        <div class="actions">
          <button id="cancel" class="secondary">Cancel</button>
          <button id="delete" class="secondary">Delete</button>
        </div>
      </div>
      <p id="detail-meta" class="meta"></p>
      <h3>Prompt</h3>
      <pre id="detail-prompt"></pre>
      <details id="reasoning-box" hidden><summary>Reasoning</summary><pre id="detail-reasoning"></pre></details>
      <h3>Output</h3>
      <pre id="detail-output"></pre>
      <p id="detail-error" class="error"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
