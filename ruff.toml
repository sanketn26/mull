# Correctness-level checks only: syntax errors and pyflakes (undefined names, unused imports
# and variables). Style rules are left off so the existing code is not flagged wholesale.
target-version = "py39"
line-length = 120
extend-exclude = ["*.ipynb"]

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# Package __init__ files re-export names on purpose.
"__init__.py" = ["F401"]
