name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Apple-silicon runner: the MLX backend and several tests are macOS-only.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (uv sync from uv.lock)
        run: uv sync --locked --extra mac
      - name: Lint
        run: make lint
      - name: Test (offline, no model downloads)
        run: make test
        env:
          HF_HUB_OFFLINE: "1"
